<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot Admin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Customer list -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="me">
          <div class="avatar avatar-me" id="me-avatar">A</div>
          <select id="store-select" aria-label="Store"></select>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="refresh-btn" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
          </button>
          <button class="icon-btn" id="logout-btn" title="Log out" aria-label="Log out">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16 17v-3H9v-4h7V7l5 5-5 5ZM14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9Z"/></svg>
          </button>
        </div>
      </header>

      <div class="mock-banner" id="mock-banner" hidden>Showing dummy data (mock mode)</div>

      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
        <input id="search" placeholder="Search name or number" autocomplete="off">
      </div>

      <ul class="chat-list" id="chat-list" aria-label="Customers"></ul>
      <p class="list-status" id="list-status"></p>
    </aside>

    <!-- Selected conversation -->
    <main class="chat" id="chat">
      <div class="chat-empty" id="chat-empty">
        <svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true"><path fill="currentColor" d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2Zm0 14H5.17L4 17.17V4h16v12Z"/></svg>
        <h2>Chatbot conversations</h2>
        <p>Select a customer to see their messages with the bot.</p>
      </div>

      <div class="chat-view" id="chat-view" hidden>
        <header class="chat-header">
          <button class="icon-btn back-btn" id="back-btn" aria-label="Back to customers">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg>
          </button>
          <div class="avatar" id="chat-avatar"></div>
          <div class="chat-title">
            <h2 id="chat-name"></h2>
            <p id="chat-sub"></p>
          </div>
        </header>

        <div class="messages" id="messages"></div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
